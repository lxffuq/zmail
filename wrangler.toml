name = "zmail"
main = "worker/src/index.ts"
minify = true
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# keep_vars = true：部署时保留控制台里手动设置的变量（例如 EMAIL_DOMAIN），
# 不会被配置文件覆盖或删除。
keep_vars = true

# 收信域名不在这里写死：在控制台 Worker → 设置 → 变量里添加 EMAIL_DOMAIN，
# 前端启动时通过 /api/config 读取，改完即生效，无需重新构建。
# 也可以用 npx wrangler deploy --var EMAIL_DOMAIN:example.com 的方式设置。

# D1 数据库：部署工具（Wrangler 3）要求填 database_id；库已由用户在控制台建好，
# ID 写在这里，部署时直接绑定，不再自动创建。
[[d1_databases]]
binding = "DB"
database_name = "tempmail"
database_id = "1001f567-5353-4f6d-a746-4f6441679860"

# 每小时清理过期邮箱和邮件
[triggers]
crons = ["0 * * * *"]

# 前端静态资源：构建产物在 frontend/dist；单页应用路由 fallback 到 index.html
[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"

[observability]
enabled = false

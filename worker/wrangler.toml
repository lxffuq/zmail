name = "zmail-backend"
main = "src/index.ts"

# 打包配置
minify = true # 生产环境压缩代码
compatibility_flags = [ "nodejs_compat" ]
compatibility_date = "2025-03-01"

# 启用 D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "tempmail"
# database_id 由一键部署脚本 ./deploy.sh 自动填入；
# 手动部署时，先运行 npx wrangler d1 create tempmail，再把得到的 ID 填到这里。
database_id = "REPLACE_WITH_YOUR_D1_ID"

# 配置邮件处理
[triggers]
crons = ["0 * * * *"]  # 每小时运行一次清理任务

[build]
command = "" # 使用默认打包，不需要自定义构建命令

# 默认开启日志，方便调试
[observability]
enabled = false
head_sampling_rate = 1 # optional. default = 1.
